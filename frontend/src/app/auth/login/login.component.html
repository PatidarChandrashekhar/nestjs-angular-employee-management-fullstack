<div class="login-wrapper">
  <form class="login-card card" (ngSubmit)="submit()">
    <div class="login-brand">
      <span class="navbar-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M12 2 2 7l10 5 10-5-10-5Z M2 17l10 5 10-5 M2 12l10 5 10-5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <div>
        <h1>Employee Management</h1>
        <p class="subtitle">Sign in to continue</p>
      </div>
    </div>

    @if (errorMessage()) {
      <div class="alert-error">{{ errorMessage() }}</div>
    }

    <label>
      Email
      <span class="input-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M4 4h16v16H4V4Zm0 2 8 7 8-7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <input
          type="email"
          name="email"
          autocomplete="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          required
        />
      </span>
    </label>

    <label>
      Password
      <span class="input-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="11" width="14" height="9" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <input
          type="password"
          name="password"
          autocomplete="current-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          required
        />
      </span>
    </label>

    <button type="submit" class="btn-primary" [disabled]="isLoading()">
      {{ isLoading() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="login-hint">demo: admin&#64;company.com / Admin&#64;12345</p>
  </form>
</div>
